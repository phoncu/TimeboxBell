name: Release

# Push tagu vX.Y.Z: otestuje, publikuje single-file .exe a založí koncept (draft) release.
# Koncept se zveřejní ručně až po projití docs/release-checklist.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/TimeboxBell.Tray -c Release -o artifacts/release `
            -p:PublishSingleFile=true -p:Version=$version --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/TimeboxBell.Console -c Release -o artifacts/release `
            -p:PublishSingleFile=true -p:Version=$version --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $files = 'TimeboxBell.exe', 'TimeboxBell.Console.exe', 'appsettings.json' |
            ForEach-Object { Join-Path artifacts/release $_ }
          $files | Where-Object { -not (Test-Path $_) } | ForEach-Object { throw "Chybí $_" }
          Compress-Archive -Path $files -DestinationPath "artifacts/TimeboxBell-$version-win-x64.zip"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          gh release create $tag --draft --verify-tag --title "TimeboxBell $version" --generate-notes `
            artifacts/release/TimeboxBell.exe `
            artifacts/release/TimeboxBell.Console.exe `
            artifacts/release/appsettings.json `
            "artifacts/TimeboxBell-$version-win-x64.zip"
